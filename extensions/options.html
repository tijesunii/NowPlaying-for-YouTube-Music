<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NowPlaying Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h1>Configuration</h1>
        <p class="subtitle">Set your webhook destination for NowPlaying.</p>
        
        <div class="form-group">
            <label for="apiUrl">API Endpoint</label>
            <input type="text" id="apiUrl" placeholder="https://your-domain.com/api/now-playing.php" spellcheck="false">
        </div>

        <div class="form-group">
            <label for="secretToken">Secret Token</label>
            <input type="password" id="secretToken" placeholder="your_secret_token" spellcheck="false">
        </div>

        <button id="saveBtn">SAVE CONFIGURATION</button>
        <div id="status" class="hidden">Settings saved successfully!</div>
    </div>

    <script src="options.js"></script>
</body>
</html>
